[versions]
# Plugins
loom = "1.7-SNAPSHOT"
kotlin = "2.0.10"
yamlang = "1.4.0"
mpp = "0.4.+"
# MC setup
minecraft = "1.21"
fabric-loader = "0.16.2"
fabric-yarn = "1.21+build.2"
fabric-api = "0.102.0+1.21"
fabric-language-kotlin = "1.12.0+kotlin.2.0.10"
# Dependencies
owo-lib = "0.12.11+1.21"
simple-vc-api = "2.5.0"
simple-vc = "fabric-1.21-2.5.17"
plasmo-vc-api = "2.1.0-SNAPSHOT"
plasmo-vc-config = "1.0.0"
plasmo-vc = "fabric-1.21-2.0.10"
modmenu = "11.0.1"
dev-auth = "1.2.0"
okhttp = "4.12.0"
okio = "3.9.1"

[plugins]
fabric-loom = { id = "fabric-loom", version.ref = "loom" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
yamlang = { id = "me.fallenbreath.yamlang", version.ref = "yamlang" }
mpp = { id = "me.modmuss50.mod-publish-plugin", version.ref = "mpp" }

[libraries]
minecraft = { group = "com.mojang", name = "minecraft", version.ref = "minecraft" }
yarn-mappings = { group = "net.fabricmc", name = "yarn", version.ref = "fabric-yarn" }
fabric-loader = { group = "net.fabricmc", name = "fabric-loader", version.ref = "fabric-loader" }
fabric-api = { group = "net.fabricmc.fabric-api", name = "fabric-api", version.ref = "fabric-api" }
fabric-kotlin = { group = "net.fabricmc", name = "fabric-language-kotlin", version.ref = "fabric-language-kotlin" }

owo = { group = "io.wispforest", name = "owo-lib", version.ref = "owo-lib" }
owo-sentinel = { group = "io.wispforest", name = "owo-sentinel", version.ref = "owo-lib" }
simplevc-api = { group = "de.maxhenkel.voicechat", name = "voicechat-api", version.ref = "simple-vc-api" }
simplevc = { group = "maven.modrinth", name = "simple-voice-chat", version.ref = "simple-vc" }
plasmovc-api = { group = "su.plo.voice.api", name = "client", version.ref = "plasmo-vc-api" }
plasmovc-config = { group = "su.plo.config", name = "config", version.ref = "plasmo-vc-config" }
plasmovc = { group = "maven.modrinth", name = "plasmo-voice", version.ref = "plasmo-vc" }
modmenu = { group = "com.terraformersmc", name = "modmenu", version.ref = "modmenu"}
devauth = { group = "me.djtheredstoner", name = "DevAuth-fabric", version.ref = "dev-auth" }
okhttp = { group = "com.squareup.okhttp3", name = "okhttp", version.ref = "okhttp" }
okio = { group = "com.squareup.okio", name = "okio", version.ref = "okio" }

